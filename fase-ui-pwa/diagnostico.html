<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diagnóstico · Lumière Import</title><style>body{font:16px system-ui;max-width:800px;margin:30px auto;padding:20px;background:#f4f4f6;color:#211a20}h1{color:#b0195b}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid #e2dfe5;border-radius:12px;padding:14px}a,button{display:inline-block;padding:12px;margin-right:8px}</style></head><body><h1>Diagnóstico del catálogo</h1><p>Comprobaciones técnicas del navegador para Lumière Import. No modifica ni elimina registros.</p><button id="check">Actualizar comprobaciones</button><pre id="result" role="status"></pre><a href="index.html">Volver al catálogo</a><a href="auditoria.html">Auditoría</a><script>
async function check(){const result={pantalla:innerWidth+' × '+innerHeight,conexion:navigator.onLine?'En línea':'Sin conexión',contextoSeguro:isSecureContext,serviceWorker:'serviceWorker'in navigator,registros:0,caches:[],almacenamiento:false,productos:0,movimientos:0,eventos:0,tema:document.documentElement.dataset.theme||'sistema',hidratado:document.documentElement.dataset.hidratado||'no'};try{result.registros=(await navigator.serviceWorker.getRegistrations()).filter(r=>r.scope===new URL('./',location).href).length;result.caches=(await caches.keys()).filter(k=>k.startsWith('inventario-'));}catch{}try{result.almacenamiento=!!localStorage;const data=JSON.parse(localStorage.getItem('inv_data_v1')||'{}');result.productos=data.p?.length||0;result.movimientos=data.m?.length||0;result.eventos=JSON.parse(localStorage.getItem('inv_bitacora_v1')||'[]').length;}catch{}document.getElementById('result').textContent=JSON.stringify(result,null,2);}document.getElementById('check').addEventListener('click',check);check();
</script></body></html>
